<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 Vista por Meses</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
    <link rel="stylesheet" href="meses-estilos.css">
    <script>
        if (!sessionStorage.getItem('acceso')) { window.location.href = 'login.html'; }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <button class="btn-volver" id="btn-volver" onclick="volverAlRegistro()">Volver al Registro</button>

    <h1>Congregacion Agua Azul</h1>
    <p class="subtitulo">Organizado por mes - Datos de cada publicador</p>
    <p class="subtitulo" id="anio-servicio-titulo" style="color:#7dcfff;font-weight:bold;"></p>

    <div class="controles">
        <label for="select-mes">Mes:</label>
        <select id="select-mes">
            <option value="0">Septiembre</option>
            <option value="1">Octubre</option>
            <option value="2">Noviembre</option>
            <option value="3">Diciembre</option>
            <option value="4">Enero</option>
            <option value="5">Febrero</option>
            <option value="6">Marzo</option>
            <option value="7">Abril</option>
            <option value="8">Mayo</option>
            <option value="9">Junio</option>
            <option value="10">Julio</option>
            <option value="11">Agosto</option>
        </select>

        <label for="select-grupo-mes">Grupo:</label>
        <select id="select-grupo-mes">
            <option value="todos">Todos</option>
        </select>

        <label for="select-anio-servicio">Año Serv.:</label>
        <select id="select-anio-servicio">
            <option value="todos">Todos</option>
        </select>

        <button class="btn-pdf" id="btn-pdf-mes">Generar PDF del Mes</button>
        <button class="btn-pdf" id="btn-editar-masivo" style="background-color:#7aa2f7;">Editar Todos</button>
        <button class="btn-pdf" id="btn-deshacer" style="background-color:#e0af68;" disabled>Deshacer</button>
    </div>

    <div id="estadisticas-container"></div>
    <div id="contenedor-mes"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="utils.js"></script>
    <script src="meses.js?v=13"></script>
</body>
</html>
